services:
  server1:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server1:/app
    environment:
      PORT: 3000
      SERVER_NAME: server1
    command: ["node", "index.js"]
    ports:
      - "3001:3000"
    restart: unless-stopped

  server2:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./server2:/app
    environment:
      PORT: 3001
      SERVER_NAME: server2
    command: ["node", "index.js"]
    ports:
      - "3002:3001"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
    restart: unless-stopped

